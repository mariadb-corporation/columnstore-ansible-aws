---

- hosts: "primary,replicas"
  become: yes
  become_user: root
  gather_facts: true
  vars_files:
    - '../inventory/group_vars/distro/{{ ansible_distribution|lower }}{{ ansible_distribution_major_version }}.yml'
    - '../inventory/group_vars/all.yml'

  tasks:

  - name: "Download cs_package_manager to nodes"
    get_url:
      url: "{{ cs_package_manager_url | default('https://raw.githubusercontent.com/mariadb-corporation/mariadb-columnstore-engine/refs/heads/stable-23.10/cmapi/scripts/cs_package_manager.sh') }}"
      dest: "/usr/local/bin/cs_package_manager.sh"
      mode: '0755'
      force: yes

  - name: "Debug cs_package_manager_custom_version"
    debug:
      var: cs_package_manager_custom_version

  - name: "Install MariaDB ColumnStore via cs_package_manager"
    command: >-
      bash /usr/local/bin/cs_package_manager.sh install {{ cs_package_manager_custom_version }} --with-dev
      {% if dev_drone_key is defined and dev_drone_key != "" %}-dev {{ dev_drone_key }}{% endif %}
    register: cs_install_output

  - name: "cs_package_manager install output"
    debug:
      msg: "{{ cs_install_output.stdout }}"
    when: cs_install_output.stdout is defined and cs_install_output.stdout != ""

  - name: "cs_package_manager install errors"
    debug:
      msg: "{{ cs_install_output.stderr }}"
    when: cs_install_output.stderr is defined and cs_install_output.stderr != ""
